<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#050a14"/>
<title>Dynamo Vodny 🏐</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#050a14;min-height:100vh;font-family:sans-serif;}
#root{min-height:100vh;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-thumb{background:#1e3a5a;border-radius:2px;}
#lock{position:fixed;inset:0;z-index:9999;background:#050a14;display:none;align-items:center;justify-content:center;}
.ck{width:20px;height:20px;border-radius:5px;border:1.5px solid #1e3a5a;background:#0a1018;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ck.on{background:#1a4a9a;border-color:#3a6aff;}
</style>
</head>
<body>

<div id="lock">
  <div style="background:#0c1525;border:1px solid #1e3a5a;border-radius:20px;padding:36px 32px;width:90%;max-width:340px;text-align:center;">
    <div style="font-size:52px;margin-bottom:14px">🏐</div>
    <div style="font-size:20px;font-weight:900;color:#e0eeff;letter-spacing:.05em;margin-bottom:3px">DYNAMO VODNY</div>
    <div style="font-size:11px;color:#2a5a8a;letter-spacing:.1em;margin-bottom:26px;text-transform:uppercase">Система управления</div>
    <div id="pw-err" style="display:none;background:#1a0808;border:1px solid #3a1010;color:#ef4444;border-radius:8px;padding:9px 14px;font-size:13px;margin-bottom:12px">⚠️ Неверный пароль</div>
    <input id="pw" type="password" placeholder="Пароль"
      style="width:100%;background:#0a1018;border:1.5px solid #1e2d4a;border-radius:11px;color:#c0d0e8;font-size:18px;padding:15px;outline:none;text-align:center;letter-spacing:.25em;margin-bottom:11px;"
      onfocus="this.style.borderColor='#3a6aaa'" onblur="this.style.borderColor='#1e2d4a'"
      onkeydown="if(event.key==='Enter')login()"/>
    <button onclick="login()" style="width:100%;background:#1a4a9a;color:#fff;border:none;border-radius:11px;font-size:16px;font-weight:800;padding:15px;cursor:pointer;margin-bottom:14px;">ВОЙТИ</button>
    <div style="display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:18px;">
      <div class="ck" id="rem-chk" onclick="toggleRemember()"></div>
      <span style="font-size:13px;color:#4a6a8a;cursor:pointer" onclick="toggleRemember()">Запомнить меня на 30 дней</span>
    </div>
    <div style="display:flex;gap:5px;justify-content:center;">
      <span style="font-size:10px;color:#1a3a5a;border:1px solid #1a2a40;border-radius:20px;padding:3px 9px">👤 Администратор</span>
      <span style="font-size:10px;color:#1a3a5a;border:1px solid #1a2a40;border-radius:20px;padding:3px 9px">👥 Сотрудник</span>
    </div>
    <div style="margin-top:14px;font-size:10px;color:#1a2a3a">Адм. Михаил М. А</div>
  </div>
</div>

<div id="root"></div>

<script>
// ══════════════════════════════════════
// ПАРОЛИ — меняй прямо здесь
// ══════════════════════════════════════
var PASSWORDS = {
  "admin2026": "admin",
  "staff2026": "staff",
};
var SESSION_KEY  = "DV_AUTH_V10";
var REMEMBER_KEY = "DV_REMEMBER_V10";
var rememberMe   = false;

function toggleRemember(){
  rememberMe = !rememberMe;
  var chk = document.getElementById("rem-chk");
  chk.className = "ck" + (rememberMe ? " on" : "");
  chk.textContent = rememberMe ? "✓" : "";
}

function login(){
  var val  = document.getElementById("pw").value.trim();
  var role = PASSWORDS[val];
  if(role){
    window.__dvRole = role;
    if(rememberMe){
      var exp = Date.now() + 30*24*60*60*1000;
      localStorage.setItem(REMEMBER_KEY, JSON.stringify({role:role, exp:exp}));
    }
    sessionStorage.setItem(SESSION_KEY, role);
    document.getElementById("lock").style.display = "none";
  } else {
    var e = document.getElementById("pw-err");
    e.style.display = "block";
    document.getElementById("pw").value = "";
    setTimeout(function(){ e.style.display="none"; }, 2500);
  }
}

// Check persistent login on load
(function(){
  // 1. Check "remember me" in localStorage
  try {
    var rem = JSON.parse(localStorage.getItem(REMEMBER_KEY)||"null");
    if(rem && rem.exp > Date.now()){
      window.__dvRole = rem.role;
      sessionStorage.setItem(SESSION_KEY, rem.role);
      return; // skip lock screen
    } else if(rem) {
      localStorage.removeItem(REMEMBER_KEY); // expired
    }
  } catch(e){}

  // 2. Check session
  var r = sessionStorage.getItem(SESSION_KEY);
  if(r){ window.__dvRole = r; return; }

  // 3. Show lock screen
  var lk = document.getElementById("lock");
  lk.style.display = "flex";
  setTimeout(function(){ try{ document.getElementById("pw").focus(); }catch(e){} }, 100);
})();
</script>

*{box-sizing:border-box;margin:0;padding:0;}
body{background:#050a14;}

.hdr{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#07111f;border-bottom:1px solid #0e1e30;position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:10px;}
.hdr-logo{display:flex;align-items:center;gap:12px;}
.logo-ball{font-size:36px;filter:drop-shadow(0 0 8px #3b82f655);}
.logo-title{font-weight:900;font-size:18px;color:#e0eeff;letter-spacing:0.04em;line-height:1;}
.logo-sub{font-size:10px;color:#2a5a8a;margin-top:2px;letter-spacing:0.04em;}
.hdr-actions{display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;}

.nav{display:flex;overflow-x:auto;background:#07111f;border-bottom:1px solid #0e1e30;scrollbar-width:none;-webkit-scrollbar{display:none}}
.ntab{display:flex;align-items:center;gap:6px;padding:12px 14px;background:transparent;border:none;color:#3a5a78;cursor:pointer;font-family:inherit;font-size:14px;font-weight:700;white-space:nowrap;transition:all 0.15s;position:relative;border-bottom:2px solid transparent;}
.ntab:hover{color:#7a9ab8;background:#0a1525;}
.ntab-on{color:#60a5fa!important;border-bottom-color:#60a5fa;}
.ntab-lbl{display:inline;}
.nbadge{background:#ef4444;color:#fff;border-radius:10px;font-size:12px;padding:2px 7px;font-weight:700;}

.main{padding:14px 14px 40px;}
.wfull-main{padding:0;height:100vh;overflow:hidden;}

.btn{cursor:pointer;border:none;border-radius:11px;font-family:inherit;font-size:15px;font-weight:700;padding:14px 22px;transition:all 0.15s;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;line-height:1;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:#1a4a9a;color:#fff;}
.btn-primary:hover{background:#2a5aaa;}
.btn-ghost{background:#0e1525;border:1px solid #1e2d4a;color:#7a9ab8;}
.btn-ghost:hover{background:#121d30;color:#c0d0e8;}
.btn-danger{background:#1a0808;border:1px solid #3a1010;color:#ef4444;}
.btn-danger:hover{background:#2a1010;}
.btn-ai{background:linear-gradient(135deg,#1a2a6a,#3a1a6a);color:#c0a0ff;border:1px solid #3a2a8a;}
.btn-ai:hover{background:linear-gradient(135deg,#2a3a7a,#4a2a7a);}
.btn-sm{padding:10px 18px;font-size:14px;border-radius:9px;min-height:40px;}

.conflict-pill{background:#1a0808;border:1px solid #3a1010;color:#ef4444;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:700;animation:blink 2s infinite;}
.rem-pill{background:#1a0808;color:#fbbf24;border:1px solid #7a6010;border-radius:20px;padding:6px 12px;cursor:pointer;font-size:11px;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}

.inp{width:100%;background:#0a1018;border:1px solid #1e2d4a;border-radius:10px;color:#c0d0e8;font-family:inherit;font-size:15px;padding:13px 16px;outline:none;transition:border-color 0.15s;}
.inp:focus{border-color:#3a6aaa;}
.inp-sm{padding:10px 14px;font-size:14px;border-radius:9px;}
.lbl{display:block;font-size:13px;color:#3a5a70;font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.06em;}

.overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:500;}
.modal{background:#0c1525;border:1px solid #1e3a5a;border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:hidden;display:flex;flex-direction:column;}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid #1a2a40;flex-shrink:0;}
.mh{font-size:19px;font-weight:800;color:#e0eeff;}
.modal-body{overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px;}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.form-section{background:#0a1020;border:1px solid #1e2d4a;border-radius:10px;padding:12px 14px;}
.sec-hdr{font-size:13px;font-weight:700;color:#4a6a8a;text-transform:uppercase;letter-spacing:0.08em;}

.bk-card{background:#0e1525;border:1px solid #1e2d4a;border-left:3px solid #2a4a8a;border-radius:12px;padding:16px 18px;}
.grid-card{background:#0e1525;border:1px solid #1e2d4a;border-radius:12px;padding:14px 16px;}

.tag{border-radius:12px;padding:3px 10px;font-size:12px;font-weight:700;}
.tag-free{background:#1a3a1a;color:#34d399;}
.tag-spec{background:#1a2a4a;color:#60a5fa;}
.tag-org{background:#1a1a0e;color:#f59e0b;}

.toggle{width:60px;height:32px;border-radius:16px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle-knob{position:absolute;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 6px #0008;}
.chk{width:24px;height:24px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;border:2px solid #2a4060;}
.check-label{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
.counter-btn{width:44px;height:44px;border-radius:9px;border:1px solid #1e2d4a;background:#0a1020;color:#c0d0e8;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.counter-btn:hover{background:#151f30;border-color:#3a5a80;}

.empty{text-align:center;padding:40px;color:#2a4060;font-size:16px;}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.icon-btn{background:transparent;border:none;cursor:pointer;color:#3a5a80;font-size:18px;padding:6px 8px;border-radius:6px;line-height:1;min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center;}
.icon-btn:hover{color:#c0d0e8;}

.kpi{background:#0e1525;border:1px solid #1e2d4a;border-radius:11px;padding:14px 18px;}
.kpi-l{font-size:11px;color:#3a5a80;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px;}
.kpi-v{font-size:24px;font-weight:900;}
.kpi-row{display:flex;gap:8px;flex-wrap:wrap;}

.today-hero{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:14px;padding:16px;background:linear-gradient(135deg,#080f1e,#0c1830);border-radius:12px;border:1px solid #1e3a5a;}
.today-dow{font-size:26px;font-weight:900;color:#fff;letter-spacing:-.01em;line-height:1;}
.today-date{font-size:14px;color:#3a6a9a;margin-top:3px;}
.org-banner{background:#1a0e08;border:1px solid #f9731633;border-radius:8px;padding:10px 14px;font-size:13px;color:#f97316;margin-bottom:8px;}
.courts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;}
.court-chip{padding:7px 5px;border-radius:8px;border:1px solid #1a2a40;text-align:center;}
.evt-list{display:flex;flex-direction:column;gap:6px;}
.evt-card{background:#0e1525;border:1px solid #1e2d4a;border-left:3px solid #2a4a8a;border-radius:9px;padding:12px 14px;cursor:pointer;}
.evt-main{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.evt-info{display:flex;align-items:center;gap:8px;}
.evt-name{font-weight:700;font-size:16px;color:#fff;display:flex;align-items:center;gap:6px;}
.evt-sub{font-size:13px;color:#3a5570;margin-top:3px;}
.evt-right{display:flex;align-items:center;gap:8px;}
.evt-time{font-size:16px;font-family:monospace;font-weight:700;}
.dot-now{width:8px;height:8px;border-radius:50%;display:inline-block;animation:pulse 1.4s infinite;flex-shrink:0;}
.now-chip{background:#1a3a1a;color:#34d399;border:1px solid #34d39944;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

.note-card{background:#0e1525;border:1px solid #1e2d4a;border-radius:10px;padding:12px 14px;}

.week-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;padding:0 0 8px;border-bottom:1px solid #0e1e30;}
.week-title{font-weight:700;font-size:14px;color:#c0d8f0;}
.week-legend{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.legend-chip{display:flex;align-items:center;gap:5px;background:#0e1525;border:1px solid #1e2d4a;border-radius:16px;padding:3px 9px;font-size:11px;color:#c0d0e8;}
.week-grid-wrap{display:flex;overflow:hidden;border:1px solid #1a2a40;border-radius:12px;}
.week-time-col{display:flex;flex-direction:column;background:#090d18;border-right:1px solid #1e2d4a;flex-shrink:0;overflow:hidden;}
.week-time-cell{display:flex;align-items:center;padding-left:10px;font-size:10px;font-family:'Courier New',monospace;color:#2a4a70;font-weight:600;flex-shrink:0;border-bottom:1px solid #0e1520;}
.week-days-scroll{flex:1;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0e1525;border:1px solid #1e3a5a;border-radius:12px;padding:12px 22px;font-size:13px;font-weight:600;color:#c0d0e8;z-index:9999;box-shadow:0 8px 30px #000c;pointer-events:none;}
.toast-ok{border-color:#22c55e44;color:#34d399;}
.toast-err{border-color:#ef444444;color:#ef4444;}

@media(min-width:640px){
  .ntab-lbl{display:inline;}
  .ntab{padding:12px 16px;font-size:13px;}
  .main{padding:20px 24px 60px;}
  .overlay{align-items:center;}
  .modal{border-radius:16px;max-height:90vh;}
}
/* ── DESKTOP LAYOUT (sidebar) ── */
@media(min-width:900px){
  /* App shell: sidebar + content */
  body{overflow:hidden;}
  .app-shell{display:flex;height:100vh;overflow:hidden;}
  .sidebar{
    width:200px;flex-shrink:0;
    background:#06101e;
    border-right:1px solid #1a2d4a;
    display:flex;flex-direction:column;
    padding:0;overflow-y:auto;
    position:fixed;left:0;top:0;bottom:0;z-index:50;
  }
  .sidebar-logo{
    padding:18px 16px 14px;
    border-bottom:1px solid #1a2d4a;
    display:flex;align-items:center;gap:10px;
  }
  .sidebar-logo .logo-title{font-size:14px;font-weight:800;color:#ddeeff;letter-spacing:.05em;}
  .nav{
    flex-direction:column;padding:8px 0;gap:2px;
    border-bottom:none;overflow:visible;
  }
  .ntab{
    border-radius:8px;margin:0 8px;padding:9px 12px;
    justify-content:flex-start;gap:10px;
    font-size:13px;border-bottom:none;
  }
  .ntab-on{background:#0e2040;border-radius:8px;border-bottom:none;color:#60a5fa;}
  .ntab-on::after{display:none;}
  .sidebar-actions{
    padding:12px;border-top:1px solid #1a2d4a;
    display:flex;flex-direction:column;gap:6px;
    margin-top:auto;
  }
  /* Push content right */
  .hdr{padding:12px 24px;margin-left:200px;}
  .main{margin-left:200px;padding:20px 28px 40px;height:calc(100vh - 57px);overflow-y:auto;max-width:none;}
  .wfull-main{margin-left:200px;}
  /* Hide mobile-only elements on desktop */
  .hdr-logo{display:none;}
  .hdr-bron{display:none;}
  /* Bigger content area */
  .form-grid{grid-template-columns:1fr 1fr 1fr 1fr;}
  .kpi-v{font-size:28px;}
  .week-time-cell{font-size:12px;}
  .btn{padding:10px 18px;font-size:14px;}
  .btn-sm{padding:7px 14px;font-size:13px;}
  /* Modal wider */
  .modal{border-radius:14px;max-height:88vh;}
}
